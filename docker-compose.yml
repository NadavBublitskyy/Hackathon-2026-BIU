# This file defines how to run the Repo Explorer stack in Docker or Podman Compose.

# Set the Compose project name, defaulting to repo-explorer when no env value is provided.
name: ${COMPOSE_PROJECT_NAME:-repo-explorer}

# Start the list of Compose services.
services:
  # Define the FastAPI backend service for The Brain.
  backend:
    # Define how the backend image should be built.
    build:
      # Use the repository root so the backend image can include Memory.
      context: .
      # Use the Containerfile inside The Brain as the image recipe.
      dockerfile: The Brain/Containerfile
    # Define environment variables injected into the container.
    environment:
      # Pass the app environment into the container.
      APP_ENV: ${APP_ENV:-development}
      # Pass the selected LLM provider into the container.
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      # Pass the remote LLM base URL into the container.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      # Pass the selected LLM model name into the container.
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openai/gpt-4o-mini}
      # Pass a generic LLM API key into the container when it exists.
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Pass the OpenRouter API key into the container.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Pass the GitHub Personal Access Token into the container.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Pass the frontend origins allowed to call the backend.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    # Define host-to-container port mappings.
    ports:
      # Expose container port 8000 on the configured host backend port.
      - "${BACKEND_PORT:-8000}:8000"
    # Persist ChromaDB data and the downloaded embedding model across rebuilds/recreates.
    volumes:
      # Keep the indexed vectors between backend container recreations.
      - chroma-db:/app/Memory/chroma_db
      # Keep Chroma's ONNX embedding model cache so it is not downloaded every time.
      - chroma-cache:/root/.cache/chroma
    # Define Docker's readiness check for the backend service.
    healthcheck:
      # Define the command Docker runs to check LLM readiness.
      test:
        # Run the healthcheck as a command.
        - CMD
        # Use Python inside the container for the HTTP check.
        - python
        # Tell Python to execute the following inline code.
        - -c
        # Call the LLM status endpoint and fail if it is unreachable or not ready.
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/llm/status', timeout=5)"
      # Run the healthcheck every 20 seconds.
      interval: 20s
      # Fail one healthcheck attempt if it takes longer than 5 seconds.
      timeout: 5s
      # Mark the service unhealthy after 3 failed healthcheck attempts.
      retries: 3
      # Give the service 20 seconds to start before healthcheck failures count.
      start_period: 20s
    env_file:
    - .env

  # Define the React/Vite frontend service.
  frontend:
    # Define how the frontend image should be built.
    build:
      # Use the Frontend folder as the Docker build context.
      context: ./Frontend
      # Use the Containerfile inside Frontend as the image recipe.
      dockerfile: Containerfile
      # Pass browser-facing endpoint configuration into the Vite build.
      args:
        # Tell the browser where the Brain backend is exposed on the host.
        VITE_BRAIN_BASE_URL: ${VITE_BRAIN_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
        # Configure the ingestor API path.
        VITE_INGEST_ENDPOINT: ${VITE_INGEST_ENDPOINT:-/api/ingest}
        # Configure graph node details lookup.
        VITE_GRAPH_NODE_DETAILS_ENDPOINT: ${VITE_GRAPH_NODE_DETAILS_ENDPOINT:-/api/graph/node-details}
        # Configure the general chat API path.
        VITE_GENERAL_CHAT_ENDPOINT: ${VITE_GENERAL_CHAT_ENDPOINT:-/api/chat/routed}
        # Configure the repo-aware Brain API path.
        VITE_BLUEPRINT_ENDPOINT: ${VITE_BLUEPRINT_ENDPOINT:-/api/blueprint/routed}
        # Configure the Viki semantic retrieval API path.
        VITE_VIKI_CONTEXT_ENDPOINT: ${VITE_VIKI_CONTEXT_ENDPOINT:-/api/memory/retrieve}
        # Configure the prompt classification API path.
        VITE_PROMPT_CLASSIFY_ENDPOINT: ${VITE_PROMPT_CLASSIFY_ENDPOINT:-/api/prompt/classify}
        # Pass the GitHub Personal Access Token for frontend validation.
        VITE_GITHUB_TOKEN: ${VITE_GITHUB_TOKEN:-}
    # Define host-to-container port mappings.
    ports:
      # Expose container port 80 on the configured host frontend port.
      - "${FRONTEND_PORT:-5173}:80"
    # Start the frontend after the backend reports healthy.
    depends_on:
      backend:
        condition: service_healthy
    # Define Docker's readiness check for the static frontend.
    healthcheck:
      # Define the command Docker runs to check frontend readiness.
      test:
        # Run the healthcheck as a shell command.
        - CMD-SHELL
        # Fetch the local health endpoint served by Nginx.
        - "wget -qO- http://127.0.0.1/health >/dev/null"
      # Run the healthcheck every 20 seconds.
      interval: 20s
      # Fail one healthcheck attempt if it takes longer than 5 seconds.
      timeout: 5s
      # Mark the service unhealthy after 3 failed healthcheck attempts.
      retries: 3
      # Give the service 10 seconds to start before healthcheck failures count.
      start_period: 10s

# Define persistent local Docker volumes used by the backend.
volumes:
  # Stores ChromaDB collections.
  chroma-db:
  # Stores Chroma's downloaded embedding model cache.
  chroma-cache:
